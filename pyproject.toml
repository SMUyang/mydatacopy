[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "largefile-copy"
version = "1.0.0"
description = "Parallel, resumable MD5 verification and repair for directory trees"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
largefile-copy = "largefile_copy:main"
oss-download = "oss_download:main"

[tool.setuptools]
py-modules = ["largefile_copy", "oss_download"]
